name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
      - name: Install test dependencies
        run: uv sync --locked --extra test --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --no-sync python -m ruff check src tests scripts/check_wheel.py
      - name: Test package
        run: uv run --no-sync python -m pytest
      - name: Test legacy MCP contract
        run: uv run --no-sync python -m pytest mcp-server/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
      - name: Install build tools
        run: uv sync --locked --extra test --python 3.13
      - name: Build distributions
        run: uv run --no-sync python -m build
      - name: Validate distributions
        run: uv run --no-sync twine check dist/*
      - name: Check installed wheel
        run: uv run --no-sync python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
