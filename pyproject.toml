[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nature-academic-search"
version = "0.1.0"
description = "Academic literature search and citation workflows for PubMed, CrossRef, and arXiv"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "wp-a" }]
keywords = ["academic-search", "arxiv", "citation", "crossref", "mcp", "pubmed"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=1.27,<2",
  "requests>=2.28,<3",
  "toml>=0.10.2,<1",
]

[project.optional-dependencies]
test = [
  "build>=1.3,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.scripts]
nature-academic-search = "nature_academic_search.cli:main"
nature-academic-search-mcp = "nature_academic_search.server:main"

[project.urls]
Homepage = "https://github.com/wp-a/nature-academic-search"
Issues = "https://github.com/wp-a/nature-academic-search/issues"
Repository = "https://github.com/wp-a/nature-academic-search"

[tool.hatch.build.targets.wheel]
packages = ["src/nature_academic_search"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

